<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Yaser Safar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .name { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 96px; letter-spacing: -3px; fill: #FFFFFF; }
      .sub  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 6px; fill: #8B8B8B; }
      .fade { opacity: 0; animation: fade 1.1s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .5s } .d3 { animation-delay: .9s }
      @keyframes fade { to { opacity: 1 } }
      .grow { transform: scaleX(0); transform-origin: 600px 210px; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) .7s forwards; }
      @keyframes grow { to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .grow { animation: none; opacity: 1; transform: none }
      }
    </style>
  </defs>

  <text class="name fade d1" x="600" y="150" text-anchor="middle">Yaser Safar.</text>
  <line class="grow" x1="400" y1="210" x2="800" y2="210" stroke="#2A2A2A" stroke-width="1"/>
  <text class="sub fade d3" x="600" y="252" text-anchor="middle">SOFTWARE ENGINEERING &#183; DESIGN</text>
</svg>
